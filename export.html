<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChatVault</title>
  <style>
    :root{
      --bg:#f6f3fb; --surface:#ffffff; --text:#1d1726; --muted:#665c72; --border:#d9d1e3;
      --primary:#6d28d9; --primary-soft:#f0e8ff; --primary-border:#c9b6f2;
      --accent:#f97316; --accent-soft:#fff0e5; --accent-border:#f6c39a;
      --hero-start:#4c1d95; --hero-end:#7c3aed;
    }
    *{ box-sizing:border-box; }
    html,body{ margin:0; }
    body{
      background:var(--bg); color:var(--text);
      font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
      line-height:1.55; padding:28px 16px 72px;
      -webkit-print-color-adjust:exact; print-color-adjust:exact;
    }
    .bar{
      position:fixed; top:0; left:0; right:0; z-index:5;
      display:flex; justify-content:center; gap:10px; padding:12px;
      background:rgba(255,255,255,.92); border-bottom:1px solid var(--border);
    }
    .bar button{
      border:1px solid var(--primary); background:var(--primary); color:#fff;
      font:inherit; font-weight:700; font-size:14px; padding:9px 16px; border-radius:11px; cursor:pointer;
    }
    .bar button.ghost{ background:var(--surface); color:var(--primary); }
    .wrap{ max-width:780px; margin:60px auto 0; }
    .conv{ margin:0 auto 34px; }
    .conv h1{
      background:linear-gradient(135deg,var(--hero-start),var(--hero-end)); color:#fff;
      margin:0; padding:18px 22px; border-radius:16px 16px 0 0; font-size:22px;
    }
    .meta{
      margin:0 0 20px; padding:10px 22px; background:var(--surface);
      border:1px solid var(--border); border-top:0; border-radius:0 0 16px 16px;
      color:var(--muted); font-size:13px;
    }
    .thread{ display:flex; flex-direction:column; gap:14px; }
    .row{
      max-width:86%; padding:12px 15px; border-radius:16px;
      border:1px solid var(--border); background:var(--surface);
    }
    .row.user{ margin-left:auto; background:var(--accent-soft); border-color:var(--accent-border); border-bottom-right-radius:5px; }
    .row.assistant{ margin-right:auto; background:var(--primary-soft); border-color:var(--primary-border); border-bottom-left-radius:5px; }
    .who{ font-size:11px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; margin-bottom:5px; }
    .row.user .who{ color:#c2410c; }
    .row.assistant .who{ color:var(--primary); }
    .msg{ font-size:14.5px; white-space:pre-wrap; word-break:break-word; }
    .msg:empty{ display:none; }
    .imgs{ display:flex; flex-direction:column; gap:8px; margin-top:8px; }
    .imgs img{ max-width:100%; height:auto; border-radius:12px; border:1px solid var(--border); display:block; }
    .foot{ text-align:center; color:var(--muted); font-size:12px; margin-top:26px; }

    @page{ size:A4; margin:14mm; }
    @media print{
      body{ background:#fff; padding:0; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
      .bar{ display:none; }
      .wrap{ margin-top:0; max-width:none; }
      .row{ break-inside:avoid; }
      .conv{ break-inside:auto; }
      .imgs img{ break-inside:avoid; }
    }
  </style>
</head>
<body>
  <div class="bar" id="bar">
    <button id="printBtn" type="button">Salvar como PDF</button>
    <button id="closeBtn" class="ghost" type="button">Fechar</button>
  </div>
  <div class="wrap" id="doc"></div>
  <script src="scripts/print-view.js"></script>
</body>
</html>
