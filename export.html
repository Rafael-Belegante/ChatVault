<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChatVault</title>
  <style>
    :root{
      --bg:#f5f3f8;
      --paper:#ffffff;
      --text:#201a29;
      --muted:#71677c;
      --border:#ddd7e5;
      --primary:#6d28d9;
      --primary-soft:#f5efff;
      --user:#c2410c;
      --user-soft:#fff5ed;
      --shadow:0 20px 60px rgba(36,24,48,.10);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{
      background:var(--bg);
      color:var(--text);
      font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
      padding:84px 18px 72px;
      -webkit-print-color-adjust:exact;
      print-color-adjust:exact;
    }
    .bar{
      position:fixed;top:0;left:0;right:0;z-index:20;
      display:flex;justify-content:center;gap:10px;padding:12px 16px;
      background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
      border-bottom:1px solid var(--border);
    }
    .bar button{
      appearance:none;border:1px solid var(--primary);background:var(--primary);color:#fff;
      font:700 14px/1.2 inherit;padding:10px 17px;border-radius:11px;cursor:pointer;
    }
    .bar button.ghost{background:#fff;color:var(--primary)}
    .bar button:disabled{opacity:.5;cursor:not-allowed}
    .document{max-width:850px;margin:0 auto}
    .conversation{
      background:var(--paper);border:1px solid var(--border);border-radius:20px;
      box-shadow:var(--shadow);overflow:hidden;margin:0 0 28px;
    }
    .conversation-header{
      padding:26px 30px 22px;
      border-bottom:1px solid var(--border);
      background:linear-gradient(135deg,#faf8ff 0%,#fff 55%,#fff9f5 100%);
    }
    .brandline{
      display:flex;align-items:center;gap:8px;margin:0 0 10px;
      color:var(--primary);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    }
    .brandmark{width:8px;height:8px;border-radius:999px;background:var(--primary);display:inline-block}
    .conversation-title{margin:0;font-size:25px;line-height:1.2;letter-spacing:-.02em;overflow-wrap:anywhere}
    .meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
    .meta-chip{
      display:inline-flex;align-items:center;min-height:27px;padding:5px 9px;border-radius:999px;
      border:1px solid var(--border);background:#fff;color:var(--muted);font-size:11.5px;font-weight:650;
    }
    .messages{padding:8px 30px 22px}
    .message{position:relative;padding:20px 0 20px 18px;border-bottom:1px solid #ece8f0}
    .message:last-child{border-bottom:0}
    .message::before{content:"";position:absolute;left:0;top:20px;bottom:20px;width:3px;border-radius:3px;background:var(--primary)}
    .message.user::before{background:var(--user)}
    .message-head{display:flex;align-items:center;gap:9px;margin-bottom:8px}
    .role-badge{
      display:inline-flex;align-items:center;padding:5px 9px;border-radius:8px;
      background:var(--primary-soft);color:var(--primary);font-size:10.5px;font-weight:850;letter-spacing:.07em;text-transform:uppercase;
    }
    .message.user .role-badge{background:var(--user-soft);color:var(--user)}
    .role-detail{color:var(--muted);font-size:11px;font-weight:600}
    .message-text{
      margin:0;font-size:11.2pt;line-height:1.56;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;
    }
    .message-placeholder{color:var(--muted);font-style:italic}
    .attachment-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
    .attachment{
      border:1px dashed #cfc6d9;border-radius:9px;background:#faf9fb;color:var(--muted);
      padding:6px 9px;font-size:10.5px;font-weight:650;overflow-wrap:anywhere;
    }
    .conversation-footer{
      display:flex;justify-content:space-between;gap:12px;padding:11px 30px 13px;
      border-top:1px solid var(--border);color:var(--muted);font-size:9.5px;
    }
    .empty{
      max-width:850px;margin:0 auto;background:#fff;border:1px solid var(--border);border-radius:16px;
      padding:28px;text-align:center;color:var(--muted);
    }

    @page{size:A4;margin:14mm 14mm 16mm}
    @media print{
      body{background:#fff;padding:0}
      .bar{display:none}
      .document{max-width:none;margin:0}
      .conversation{border:0;border-radius:0;box-shadow:none;overflow:visible;margin:0}
      .conversation + .conversation{break-before:page}
      .conversation-header{padding:0 0 18px;background:#fff;border-bottom:1px solid #cbc4d4}
      .conversation-title{font-size:21pt}
      .messages{padding:6px 0 10px}
      .message{padding:15px 0 15px 16px}
      .message::before{top:15px;bottom:15px}
      .message-head{break-after:avoid}
      .role-badge,.meta-chip,.attachment{-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .message-text{font-size:10.6pt;line-height:1.48}
      .conversation-footer{padding:10px 0 0;font-size:8.5pt}
    }
  </style>
</head>
<body>
  <div class="bar" id="bar">
    <button id="printBtn" type="button">Salvar como PDF</button>
    <button id="closeBtn" class="ghost" type="button">Fechar</button>
  </div>
  <main class="document" id="document"></main>
  <script src="scripts/print-view.js"></script>
</body>
</html>
